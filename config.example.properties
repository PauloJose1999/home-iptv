# Configurações do launcher. O primeiro `python3 webos/build.py` copia este arquivo para config.properties:
# edite aquele e gere o app de novo. config.properties fica só no seu computador (fora do git).

# Chave grátis do TMDB (themoviedb.org/settings/api), para as abas Filmes e Séries. Sem ela, as abas ficam vazias.
tmdb_key=

# Chave grátis do OMDb (omdbapi.com/apikey.aspx), para a nota do IMDb do título em foco em Filmes e Séries. Vazia: só a
# nota do TMDB (★).
omdb_key=

# Trakt.tv (histórico, séries vistas, Minha lista): crie um app seu no Trakt (tipo Development, Redirect URI
# http://localhost; o passo a passo está no README) e copie só o Client ID para cá. O Client Secret não é usado: o
# login pela TV (código do dispositivo) não precisa dele, e o Trakt pede para nunca pô-lo num app. Se o Redirect URI
# do seu app for outro, ponha-o em trakt_redirect_uri. Depois, Ajustes do Início › Trakt.tv.
trakt_client_id=
trakt_redirect_uri=http://localhost

# Seu país (duas letras): quais títulos estão em quais apps.
tmdb_region=BR

# Sua cidade, para o clima e para o tema escuro depois do pôr do sol (graus decimais).
latitude=-23.5505
longitude=-46.6333
# O nome no cartão do clima.
city=

# true tira desenhos e animes das sugestões.
hide_animation=false

# auto (segue a TV), pt ou en.
language=auto

# C, F ou auto.
temperature=auto

# Apps para tirar da barra, por id ou nome (parte dele), separados por vírgula: hide_apps=netflix,prime
hide_apps=

# Canais IPTV de reserva para o card do canal da TV aberta, pelo nome (parte dele), quando o escolhido nos Ajustes do
# Início não está nas listas do Player IPTV.
live_channels=Globo,Record News,Cultura

# A chave que a TV deu para o controle remoto por rede (apps, canais, programação). Vazio: o app pede à TV uma vez.
# É sua: não compartilhe.
ssap_key=

# O Player IPTV da TV (github.com/lennylxx/webos-iptv-player). A conta e as listas IPTV ficam só nele (configure pela
# TV): ele as passa ao launcher, que mostra os canais nos cards, em Todos os canais e na gaveta › IPTV. Todo canal,
# filme e episódio toca nele. Sem o app na TV: os filmes e séries abrem no app de streaming.
iptv_app=com.lennylxx.iptv
