# Checks the texts, builds the LG app and checks web/ is ES5, on every pull request and push to main (tools/check.sh).
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: LG app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/check.sh
